version: 2

updates:
  - package-ecosystem: cargo
    directory: /impl/rust
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, rust]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: npm
    directory: /impl/ts
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, typescript]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, ci]
    commit-message:
      prefix: "chore(ci)"
